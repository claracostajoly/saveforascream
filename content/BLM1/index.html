<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BLM1</title>
<style>
  :root { color-scheme: dark; }
  html,body { margin:0; height:100%; background:#000; overflow:hidden; overscroll-behavior:none;
              font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
              cursor: crosshair; }

  /* La vidéo occupe toute la page, en boucle, avec son. */
  #v { position:fixed; inset:0; width:100vw; height:100vh; height:100dvh;
       object-fit:contain; background:#000; display:block; }

        /* Aucun texte du site ne peut être sélectionné. Une sélection repeint le
           texte au contraste du navigateur et défait le régime graphique de la
           page, qui travaille au seuil. Elle permet aussi d'emporter ailleurs un
           texte dont la lisibilité dépend de son milieu d'apparition. */
        *, *::before, *::after {
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
        }
        ::selection { background: transparent; color: inherit; }
        ::-moz-selection { background: transparent; color: inherit; }

        /* Aucune image ne se laisse prélever d'un geste. Même raison que pour le
           texte : ce qui est montré ici dépend de son milieu d'apparition, et
           l'emporter ailleurs — dans un dossier, dans un fil — le rend à un
           contraste qui n'est pas le sien. La règle n'empêche rien, elle énonce.
           Une capture d'écran reste possible, et le fichier reste joignable par
           son adresse : c'est le web, aucune page ne peut faire autrement. */
        img, video {
            -webkit-user-drag: none;
            user-drag: none;
            -webkit-touch-callout: none;
        }

        /* Chemin vers la note. Même geste que « ../ » : rien n'est expliqué,
           mais ce qui est atteignable est montré. Sans lui, la note n'était
           joignable que par un double-clic que personne ne peut deviner. */
        #nav-note, #nav-back, #nav-son {
            position: fixed;
            z-index: 10;
            color: #555;
            cursor: pointer;
            font-size: 11px;
            letter-spacing: 0.04em;
            padding: 6px 10px;
            margin: -6px -10px;
            transition: color 0.3s, opacity 1s;
            -webkit-user-select: none;
            user-select: none;
        }
        #nav-note { top: 18px; right: 18px; }
        /* Retour en arriere, meme coin et meme regime que sur les autres pages. */
        #nav-back { top: 18px; left: 18px; }
        /* Les navigateurs refusent de lancer le son sans un geste du visiteur.
           Tant que ce geste n'a pas eu lieu, la vidéo tourne muette et ce coin
           le dit ; le premier clic rend le son, rien d'autre. */
        #nav-son { bottom: 18px; left: 18px; }
        #nav-note:hover, #nav-back:hover, #nav-son:hover { color: #888; }
        .off { opacity: 0 !important; pointer-events: none; }
        html, body { -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>

<video id="v" src="saveforascream.mp4" aria-label="BLM1, 2021-. Panorama reconstruit à partir d’un dessin animé numérisé (Racketeer Rabbit, Friz Freleng, 1946), peinture numérique." autoplay loop playsinline preload="auto"
       disablepictureinpicture controlslist="nodownload noplaybackrate nofullscreen"></video>

<div id="nav-back" title="retour">../</div>
<div id="nav-note" title="note">./note</div>
<div id="nav-son" class="off" title="son">./son</div>

<script>
  const v = document.getElementById('v');
  const son = document.getElementById('nav-son');
  let muet = false;

  // Lecture avec son ; si le navigateur la refuse, lecture muette en attendant un geste.
  function lancer() {
    v.muted = false;
    const p = v.play();
    if (p && p.catch) p.catch(() => {
      muet = true; v.muted = true; son.classList.remove('off'); v.play().catch(()=>{});
    });
  }
  function rendreSon() {
    muet = false; v.muted = false; son.classList.add('off'); v.play().catch(()=>{});
  }
  lancer();

  // 1 clic : retour ; 2 clics : note. Si la vidéo est encore muette,
  // le premier geste sert d'abord à rendre le son.
  let clicTimer = null;
  document.addEventListener('click', (e) => {
    if (muet) { rendreSon(); return; }
    if (clicTimer === null) {
      clicTimer = setTimeout(() => { clicTimer = null; history.back(); }, 300);
    } else { clearTimeout(clicTimer); clicTimer = null; location.href = 'note.html'; }
  });
  let dernierTap = 0;
  document.addEventListener('touchend', (e) => {
    if (muet) return;   // le click qui suit rend le son
    const t = Date.now();
    if (t - dernierTap < 300 && t - dernierTap > 0) { location.href = 'note.html'; e.preventDefault(); }
    dernierTap = t;
  });
  // Touche F : plein écran du navigateur, comme sur BLM2.
  document.addEventListener('keydown', (e) => {
    if (muet) rendreSon();
    if (e.key.toLowerCase() === 'f') {
      document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    }
  });

  son.addEventListener('click', (e) => { e.stopPropagation(); rendreSon(); });
  document.getElementById('nav-note').addEventListener('click', (e) => {
    e.stopPropagation(); location.href = 'note.html';
  });
  document.getElementById('nav-back').addEventListener('click', (e) => {
    e.stopPropagation();
    if (history.length > 1) history.back(); else location.href = '../../index.html';
  });

  /* Le menu contextuel est la porte la plus courte vers « enregistrer
     la vidéo ». La fermer est un geste, pas une protection. */
  document.addEventListener('contextmenu', (e) => {
    if (e.target.tagName === 'IMG' || e.target.tagName === 'VIDEO') e.preventDefault();
  });
</script>
</body>
</html>
