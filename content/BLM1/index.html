<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLM1</title>
  <style>
    :root { 
      --bg: #000; 
      --fg: #888; 
    }

    html, body {
      margin: 0; 
      background: var(--bg); 
      color: var(--fg);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      cursor: crosshair; 
      -webkit-font-smoothing: antialiased; 
      -moz-osx-font-smoothing: grayscale;
      /* Empêche le rebond du scroll sur mobile pour une sensation plus rigide */
      overscroll-behavior: none;
    }

    main { 
      max-width: 680px; 
      margin: 250px auto 200px; 
      padding: 0 30px; 
    }

    figure { 
      margin: 140px 0; 
      width: 100%; 
    }

    img, video { 
      width: 100%; 
      height: auto; 
      display: block; 
      background: #0a0a0a; 
    }

    audio { 
      width: 100%; 
      margin-top: 10px; 
      filter: invert(100%) hue-rotate(180deg) brightness(0.6); 
    }
  
        /* Aucun texte du site ne peut être sélectionné. Une sélection repeint le
           texte au contraste du navigateur et défait le régime graphique de la
           page, qui travaille au seuil. Elle permet aussi d'emporter ailleurs un
           texte dont la lisibilité dépend de son milieu d'apparition. */
        *, *::before, *::after {
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
        }
        ::selection { background: transparent; color: inherit; }
        ::-moz-selection { background: transparent; color: inherit; }

        /* Aucune image ne se laisse prélever d'un geste. Même raison que pour le
           texte : ce qui est montré ici dépend de son milieu d'apparition, et
           l'emporter ailleurs — dans un dossier, dans un fil — le rend à un
           contraste qui n'est pas le sien. La règle n'empêche rien, elle énonce.
           Une capture d'écran reste possible, et le fichier reste joignable par
           son adresse : c'est le web, aucune page ne peut faire autrement. */
        img, video {
            -webkit-user-drag: none;
            user-drag: none;
            -webkit-touch-callout: none;
        }
    
        /* Chemin vers la note. Même geste que « ../ » : rien n'est expliqué,
           mais ce qui est atteignable est montré. Sans lui, la note n'était
           joignable que par un double-clic que personne ne peut deviner. */
        #nav-note {
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 10;
            color: #555;
            cursor: pointer;
            font-size: 11px;
            letter-spacing: 0.04em;
            padding: 6px 10px;
            margin: -6px -10px;
            transition: color 0.3s;
            -webkit-user-select: none;
            user-select: none;
        }
        #nav-note:hover { color: #888; }
    
        /* Retour en arriere, meme coin et meme regime que sur les autres pages.
           Le clic n'importe sur la page ramenait deja en arriere, mais rien
           ne le montrait : ce coin est la seule forme visible du retour. */
        #nav-back {
            position: fixed;
            top: 18px;
            left: 18px;
            z-index: 10;
            color: #555;
            cursor: pointer;
            font-size: 11px;
            letter-spacing: 0.04em;
            padding: 6px 10px;
            margin: -6px -10px;
            transition: color 0.3s;
            -webkit-user-select: none;
            user-select: none;
        }
        #nav-back:hover { color: #888; }
        html, body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body>

    <div id="nav-back" title="retour">../</div>


    <div id="nav-note" title="note">./note</div>

  <main>
    <figure>
      <img src="vue.jpg" alt="BLM1, 2021-. Panorama reconstruit à partir d’un dessin animé numérisé (Racketeer Rabbit, Friz Freleng, 1946), peinture numérique.">
    </figure>
  </main>

  <script>
    let clickTimer = null;

    // NAVIGATION SOURIS
    document.addEventListener('click', (e) => {
      // Sécurité : ne pas naviguer si on clique sur les contrôles média
      if (e.target.tagName === 'VIDEO' || e.target.tagName === 'AUDIO' || e.target.closest('audio')) return;

      if (clickTimer === null) {
        clickTimer = setTimeout(() => {
          clickTimer = null;
          // 1 CLIC : Retour à la page précédente (Nébuleuse)
          window.history.back(); 
        }, 300);
      } else {
        clearTimeout(clickTimer);
        clickTimer = null;
        // 2 CLICS : Aller vers la Note
        window.location.href = "note.html"; 
      }
    });

    // NAVIGATION MOBILE (TOUCH)
    let lastTap = 0;
    document.addEventListener('touchend', (e) => {
      if (e.target.tagName === 'VIDEO' || e.target.tagName === 'AUDIO' || e.target.closest('audio')) return;

      const currentTime = new Date().getTime();
      const tapLength = currentTime - lastTap;
      
      if (tapLength < 300 && tapLength > 0) {
        // DOUBLE TAP : Aller vers la Note
        window.location.href = "note.html";
        e.preventDefault(); // Empêche le zoom auto du navigateur
      }
      lastTap = currentTime;
    });
  </script>

    <script>
      document.getElementById('nav-note').addEventListener('click', (e) => {
        e.stopPropagation();          // sinon le clic déclenche aussi la page
        window.location.href = 'note.html';
      });
    </script>

    <script>
      // stopPropagation() : sans lui, ce clic atteindrait aussi le gestionnaire
      // de page, qui lance son propre minuteur de simple/double clic.
      document.getElementById('nav-back').addEventListener('click', (e) => {
        e.stopPropagation();
        if (window.history.length > 1) { window.history.back(); }
        else { window.location.href = '../../index.html'; }
      });
    </script>


    <script>
      /* Le menu contextuel est la porte la plus courte vers « enregistrer
         l'image ». La fermer est un geste, pas une protection. */
      document.addEventListener('contextmenu', (e) => {
        if (e.target.tagName === 'IMG' || e.target.tagName === 'VIDEO') e.preventDefault();
      });
      document.addEventListener('dragstart', (e) => {
        if (e.target.tagName === 'IMG') e.preventDefault();
      });
    </script>
</body>
</html>
