const TU = G.tuiles, N = G.n, CAND = G.cands, EN = G.energie;
const CALME = (()=>{ const t=[...EN].sort((a,b)=>a-b); return t[Math.floor(t.length*0.35)]; })();

const cv=document.getElementById('c'), ctx=cv.getContext('2d',{alpha:false});
const ui=id=>document.getElementById(id);
const S={ rep:180, warm:75, dur:1.6, spd:0.60, ein:0.6, eout:2.2, xf:0.26, rec:0, seuil:0.6 };

// ---- machine à états : repos → reprise → repos ----------------------------
const segA=new Int32Array(N), segB=new Int32Array(N);
G.seg.forEach(([a,b])=>{ for(let i=a;i<=b;i++){ segA[i]=a; segB[i]=b; } });
const DEPART=48;
let pos=DEPART, njump=0, nev=0, horloge=0;
let prec=-1, fondu=0;
let phase='repos', attente=0, tRep=0, duree=0, sortie=false, vitEnv=0;
function tirerAttente(){ return -Math.max(S.rep,0.5)*Math.log(1-Math.random()); }  // loi exponentielle
attente = 0;   // fixée après l'amorce

function besoin(){ return (duree + S.ein*0.5 + S.eout*0.55) * G.fps * S.spd; }
function choisir(i, piste){
  const L=CAND[i]; if(!L||!L.length) return 0;
  const memePrise=j=>(segA[j]===segA[i]);
  const assez=j=>(segB[j]-j >= (piste||0));
  const bons=L.filter(([j,c])=>c<=S.seuil);
  const LL=bons.length?bons:L;
  let tot=0; const w=LL.map(([j,c])=>{const x=Math.exp(-c*2.4)*(memePrise(j)?1:1.6)*(assez(j)?3.0:0.15);tot+=x;return x;});
  let r=Math.random()*tot;
  for(let q=0;q<LL.length;q++){ r-=w[q]; if(r<=0) return LL[q][0]; }
  return LL[LL.length-1][0];
}
function avancer(dt,vit){
  const i=Math.floor(pos), p=pos+dt*G.fps*vit;
  const change=Math.floor(p)>i;
  if(Math.floor(p)>segB[i]){                 // fin de prise : raccord obligé
    prec=i; fondu=S.xf; njump++;
    pos=choisir(segB[i],besoin()*0.6)+(p-Math.floor(p));
  } else if(change && Math.random()<S.rec*dt){   // raccord tiré en cours de route
    prec=i; fondu=S.xf; njump++;
    pos=choisir(i,besoin()*0.6)+(p-Math.floor(p));
  } else pos=p;
}
function maj(dt){
  horloge+=dt;
  if(phase==='repos'){
    if(horloge<S.warm) return;
    attente-=dt;
    if(attente<=0){
      duree=S.dur*(0.6+0.9*Math.random());
      const i=Math.round(pos), need=besoin();
      if(segB[i]-i < need){                        // piste trop courte : on se replace avant de démarrer
        prec=i; fondu=S.xf; njump++; pos=choisir(i,need);
      }
      phase='reprise'; tRep=0; sortie=false; vitEnv=0; nev++; }
    return;
  }
  tRep+=dt;
  if(!sortie && tRep>duree) sortie=true;
  const cible = sortie ? 0 : 1;
  const tau = sortie ? Math.max(S.eout,0.05) : Math.max(S.ein,0.02);
  vitEnv += (cible-vitEnv)*Math.min(1, dt/tau*2.2);
  avancer(dt, S.spd*vitEnv);
  if(sortie && vitEnv<0.06){
    const i=Math.round(pos);
    if(EN[i]<=CALME || vitEnv<0.015){        // on se fige de préférence sur un état calme
      pos=i; phase='repos'; attente=tirerAttente();
    }
  }
}

let dernierTap=0;
addEventListener('touchend',e=>{
  const t=Date.now();
  if(t-dernierTap<300 && t-dernierTap>0){ location.href='note.html'; e.preventDefault(); }
  dernierTap=t;
});
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='f'){ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); }
  if(e.code==='Space'){ e.preventDefault();
    if(phase==='repos'){ phase='reprise'; tRep=0; duree=S.dur*(0.5+1.3*Math.random()); sortie=false; vitEnv=0; nev++; } }
});

function charge(src){ return new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src;}); }

(async()=>{
  const [base,planche,alpha]=await Promise.all([charge(IMG.base),charge(IMG.planche),charge(IMG.alpha)]);
  const off=document.createElement('canvas'); off.width=TU.tw; off.height=TU.th;
  const oc=off.getContext('2d');
  const ch=document.getElementById('charge');
  ch.classList.add('off'); setTimeout(()=>ch.remove(),1100);
  attente=tirerAttente();

  const IW=base.width, IH=base.height, B=TU.box;
  let sx=1;
  function ajuster(){
    const a=IW/IH, vw=innerWidth, vh=innerHeight;
    let cw=vw, cH=vw/a; if(cH>vh){ cH=vh; cw=vh*a; }
    const dpr=Math.min(devicePixelRatio||1,2);
    cv.style.width=cw+'px'; cv.style.height=cH+'px';
    cv.width=Math.round(cw*dpr); cv.height=Math.round(cH*dpr);
    sx=cv.width/IW; ctx.imageSmoothingQuality='high';
  }
  ajuster(); addEventListener('resize',ajuster);

  function dessine(couches){          // couches : [[état, opacité], …]
    oc.globalCompositeOperation='source-over';
    oc.clearRect(0,0,TU.tw,TU.th);
    for(const [i,a] of couches){
      if(a<=0.002) continue;
      const r=Math.floor(i/TU.cols), c=i-r*TU.cols;
      oc.globalAlpha=a;
      oc.drawImage(planche, c*TU.tw, r*TU.th, TU.tw, TU.th, 0,0,TU.tw,TU.th);
    }
    oc.globalAlpha=1;
    oc.globalCompositeOperation='destination-in';   // bord fondu : plus de rectangle
    oc.drawImage(alpha,0,0,TU.tw,TU.th);
    ctx.drawImage(off, 0,0,TU.tw,TU.th, B.x*sx, B.y*sx, B.w*sx, B.h*sx);
  }

  const nextDe=G.next; const t0=performance.now(); let last=t0, acc=0, accN=0, vu=-1;
  function image(now){
    let dt=(now-last)/1000; last=now; dt=Math.min(Math.max(dt,0),0.1);
    maj(dt);
    if(fondu>0) fondu=Math.max(0,fondu-dt);
    const i0=Math.min(N-1,Math.max(0,Math.floor(pos)));
    const f=Math.min(1,Math.max(0,pos-i0));
    const i1=(nextDe[i0]>=0)?nextDe[i0]:i0;
    const clef=i0*1000+Math.round(f*100);
    if(clef!==vu || fondu>0 || phase==='reprise' || ctx.__sale!==sx){
      ctx.drawImage(base,0,0,cv.width,cv.height);
      if(fondu>0 && prec>=0 && S.xf>0){
        const g=fondu/S.xf, e=g*g*(3-2*g);
        dessine([[prec,1],[i0,(1-e)*(1-f)],[i1,(1-e)*f]]);
      } else {
        dessine([[i0,1],[i1,f]]);                          // fondu continu : plus de marches
      }
      vu=clef; ctx.__sale=sx;
    }
    window.__diag={phase:phase,idx:i0,nev:nev,nj:njump,attente:Math.max(0,attente),t:(now-t0)/1000};
    requestAnimationFrame(image);
  }
  requestAnimationFrame(image);
})();
</script>
