<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All I Had To Do Was Wait — note</title>
  <style>
    :root { --bg: #000000; --titre-color: #888; --texte-color: #888; }
    * {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      box-sizing: border-box; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    }
    body {
      margin: 0; background: var(--bg); color: var(--texte-color);
      min-height: 180vh; display: flex; flex-direction: column; align-items: center; cursor: crosshair;
    }
    main { width: 100%; max-width: 600px; padding: 150px 25px; }
    h1 {
      font-size: 14px; font-weight: 400; margin-bottom: 150px; text-align: center;
       color: var(--titre-color); cursor: pointer;
      transition: color 0.3s ease; user-select: none;
    }
    h1:hover { color: #fff; }
    .text-container { width: 100%; text-align: justify; line-height: 1.7; font-size: 13px; }
    p { margin: 0; font-weight: 300; letter-spacing: 0.02em; color: var(--texte-color); transition: color 0.4s ease; }
    p:hover { color: #fff; }
    .intro { margin-bottom: 15vh; }
    .extra-content { opacity: 0; transition: opacity 1.5s ease; }
    .extra-content.visible { opacity: 1; }
  
        /* Aucun texte du site ne peut être sélectionné. Une sélection repeint le
           texte au contraste du navigateur et défait le régime graphique de la
           page, qui travaille au seuil. Elle permet aussi d'emporter ailleurs un
           texte dont la lisibilité dépend de son milieu d'apparition. */
        *, *::before, *::after {
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
        }
        ::selection { background: transparent; color: inherit; }
        ::-moz-selection { background: transparent; color: inherit; }
    
        /* Rien ne s'éclaircit sous le doigt plus que le reste : le titre de la
           note a la couleur du texte, et la surbrillance que les navigateurs
           mobiles peignent sur un élément touché est neutralisée. */
        html, body { -webkit-tap-highlight-color: transparent; }

        /* Retour en arrière, même coin et même régime que sur les pièces.
           Le titre ramenait déjà à l'œuvre, mais rien ne le montrait. */
        #nav-back {
            position: fixed;
            top: 18px;
            left: 18px;
            z-index: 10;
            font-size: 11px;
            letter-spacing: 0.04em;
            color: #555;
            cursor: pointer;
            padding: 6px 10px;
            margin: -6px -10px;
            transition: color 0.3s;
            -webkit-user-select: none;
            user-select: none;
        }
        #nav-back:hover { color: #888; }
    </style>
</head>
<body>

  <div id="nav-back" title="retour">../</div>


  <main>
    <h1 id="note-title">All I Had To Do Was Wait_note</h1>
    <div class="text-container">
      <div class="intro">
        <p>Duplexque isdem diebus acciderat malum, quod et Theophilum insontem atrox interceperat casus...</p>
      </div>
      <div id="scroll-text" class="extra-content">
        <p>Post haec indumentum regale quaerebatur et ministris fucandae purpurae...</p>
      </div>
    </div>
  </main>

  <script>
    const title = document.getElementById('note-title');
    const extraContent = document.getElementById('scroll-text');
    let clickTimer = null;

    title.addEventListener('click', () => {
      if (clickTimer === null) {
        clickTimer = setTimeout(() => {
          clickTimer = null;
          window.history.back(); // 1 CLIC : Retour à l'oeuvre (image)
        }, 300);
      } else {
        clearTimeout(clickTimer);
        clickTimer = null;
        window.location.href = "../../index.html"; // 2 CLICS : Panic Button Accueil
      }
    });

    let lastTap = 0;
    document.addEventListener('touchend', (e) => {
      const currentTime = new Date().getTime();
      const tapLength = currentTime - lastTap;
      if (tapLength < 300 && tapLength > 0) {
        window.location.href = "../../index.html"; // DOUBLE TAP FOND : Accueil
      }
      lastTap = currentTime;
    });

    document.addEventListener('dblclick', (e) => {
      if (e.target.tagName !== 'H1') { 
        window.location.href = "../../index.html"; // DOUBLE CLIC FOND : Accueil
      }
    });

    window.addEventListener('scroll', () => {
      const trigger = window.innerHeight * 0.8;
      if (extraContent.getBoundingClientRect().top < trigger) {
        extraContent.classList.add('visible');
      } else {
        extraContent.classList.remove('visible');
      }
    });
  </script>

    <script>
      // « ../ » ramène à l'œuvre dont cette note est la note. stopPropagation()
      // évite que le clic atteigne les gestionnaires de la page. Sans historique
      // (note ouverte directement), on va à l'index du dossier, qui est l'œuvre.
      document.getElementById('nav-back').addEventListener('click', (e) => {
        e.stopPropagation();
        if (window.history.length > 1) { window.history.back(); }
        else { window.location.href = './'; }
      });
    </script>

</body>
</html>
