<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Functioning</title>
  <!-- Functioning
       Une page qui écrit « functioning », une fois par image, sans fin.
       Aucune valeur n'est choisie : la police, la taille et les couleurs sont
       celles de la machine ; le rythme est celui de l'écran ; la dérive vient
       du retard que la page prend sur sa propre cadence. -->
  <style>
    :root {
      --bg: #000;
      --fg: #fff;
    }

    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      overscroll-behavior: none;
      cursor: default;
    }

    /* Le flux occupe toute la surface, jusque sous la navigation. Police et
       taille sont celles que la machine donne par défaut à du texte
       machine. Chaque caractère a la même largeur et les lignes se coupent
       n'importe où : la page est une grille pleine, où chaque lettre perdue
       ou doublée décale tout ce qui suit. */
    #flux {
      margin: 0;
      min-height: 100vh;
      font-family: monospace;
      word-break: break-all;
      white-space: normal;
    }

    /* Navigation : celle du site, identique à toutes les pages. Seul ajout,
       un fond noir sous les deux liens, sans quoi le flux les rendrait
       illisibles. */
    #nav-back, #nav-note {
      position: fixed;
      top: 18px;
      z-index: 10;
      color: #555;
      background: var(--bg);
      cursor: pointer;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      letter-spacing: 0.04em;
      padding: 6px 10px;
      margin: -6px -10px;
      transition: color 0.3s;
    }
    #nav-back { left: 18px; }
    #nav-note { right: 18px; }
    #nav-back:hover, #nav-note:hover { color: #888; }

    /* Aucun texte du site ne peut être sélectionné. Une sélection repeint le
       texte au contraste du navigateur et défait le régime graphique de la
       page, qui travaille au seuil. Elle permet aussi d'emporter ailleurs un
       texte dont la lisibilité dépend de son milieu d'apparition. */
    *, *::before, *::after {
      -webkit-user-select: none;
      -moz-user-select: none;
      user-select: none;
    }
    ::selection { background: transparent; color: inherit; }
    ::-moz-selection { background: transparent; color: inherit; }
    html, body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body>
  <div id="nav-back" title="retour">../</div>
  <div id="nav-note" title="note">./note</div>

  <p id="flux"></p>

  <script>
    const PHRASE = 'functioning';

    const flux = document.getElementById('flux');
    const texte = document.createTextNode('');
    flux.appendChild(texte);

    let mot = PHRASE;
    let precedente = null;   // instant de l'image précédente
    let cadence = Infinity;  // l'intervalle le plus court jamais tenu par cette machine
    let suivre = true;       // le défilement suit le flux, sauf si l'on remonte

    // Une altération, tirée parmi quatre, à chances égales : remplacer une
    // lettre par une autre du mot, en effacer une, en doubler une, en
    // échanger deux. Le mot ne prend rien au dehors. Vide, il reste vide.
    function alterer(s) {
      if (!s.length) return s;
      const c = s.split('');
      const i = Math.floor(Math.random() * c.length);
      const j = Math.floor(Math.random() * c.length);
      switch (Math.floor(Math.random() * 4)) {
        case 0: c[i] = s[j]; break;
        case 1: c.splice(i, 1); break;
        case 2: c.splice(i, 0, c[i]); break;
        case 3: [c[i], c[j]] = [c[j], c[i]]; break;
      }
      return c.join('');
    }

    function tour(maintenant) {
      if (precedente !== null) {
        const intervalle = maintenant - precedente;
        cadence = Math.min(cadence, intervalle);
        // La part de retard sur la meilleure cadence de la machine est la
        // chance que le mot s'altère. À l'heure, il ne bouge pas.
        if (Math.random() < 1 - cadence / intervalle) mot = alterer(mot);
      }
      precedente = maintenant;

      texte.appendData(mot + ' ');
      document.title = mot;
      if (suivre) window.scrollTo(0, document.documentElement.scrollHeight);

      requestAnimationFrame(tour);
    }

    // Remonter de plus d'un écran suspend le suivi ; redescendre le reprend.
    window.addEventListener('wheel', () => {
      const bas = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - window.innerHeight;
      suivre = bas;
    }, { passive: true });
    window.addEventListener('touchmove', () => { suivre = false; }, { passive: true });
    window.addEventListener('touchend', () => {
      suivre = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - window.innerHeight;
    }, { passive: true });

    requestAnimationFrame(tour);

    document.getElementById('nav-back').addEventListener('click', (e) => {
      e.stopPropagation();
      if (window.history.length > 1) { window.history.back(); }
      else { window.location.href = '../../index.html'; }
    });
    document.getElementById('nav-note').addEventListener('click', (e) => {
      e.stopPropagation();
      window.location.href = 'note.html';
    });

    /* Le menu contextuel est la porte la plus courte vers « enregistrer
       l'image ». La fermer est un geste, pas une protection. */
    document.addEventListener('contextmenu', (e) => e.preventDefault());
  </script>
</body>
</html>
