<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>hold</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #f9f9f9;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      touch-action: none;
    }

    /* Le texte ne peut pas être sélectionné. Une sélection le repeindrait à plein
       contraste et annulerait le seuil que la pièce tient ; il cesserait aussi de
       dépendre de la lumière, puisqu'il pourrait être emporté ailleurs.
       La double règle couvre le glisser de souris comme le tout-sélectionner. */
    #text, #sensor, #nav-back {
      -webkit-user-select: none;
      user-select: none;
    }
    #text::selection, #text *::selection,
    #sensor::selection, #nav-back::selection {
      background: transparent;
      color: inherit;
    }

    #text {
      max-width: 80%;
      font-size: 1rem;
      line-height: 1.5;
      text-align: center;
      color: #e8e8e8;
      opacity: 0.4;
      letter-spacing: 0.06em;
      font-weight: 300;
    }

    #text span.title {
      font-weight: 400;
    }

    .gap{
      display:block;
      height:1.6em;
    }

    /* état du capteur : même typographie que la pièce, un cran plus effacé.
       Il dit si la condition d'apparition complète est réunie, et elle l'est
       rarement : l'API n'est activée que sur une poignée de navigateurs. */
    #sensor {
      position: absolute;
      bottom: 24px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      font-weight: 300;
      color: #ececec;
      opacity: 0.55;
      pointer-events: none;
    }

    /* retour en arrière, dans le régime de la page */
    #nav-back {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 10;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      font-weight: 300;
      color: #e2e2e2;
      cursor: pointer;
      padding: 6px 10px;
      margin: -6px -10px;
      transition: color 0.4s;
    }
    #nav-back:hover { color: #b8b8b8; }

    #noiseCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      mix-blend-mode: soft-light;
      opacity: 0.05;
    }
  </style>
</head>
<body>

  <div id="nav-back" title="retour">../</div>

  <div id="text">
    <span class="title">hold</span>
    <span class="gap"></span>

    just enough noise
  </div>

  <div id="sensor">sensor : unavailable</div>

  <canvas id="noiseCanvas"></canvas>

  <script>
    (function () {
      const canvas = document.getElementById('noiseCanvas');
      const ctx = canvas.getContext('2d');
      const sensorLine = document.getElementById('sensor');

      const dpr = window.devicePixelRatio || 1;
      const noiseSize = 220;

      const noiseCanvas = document.createElement('canvas');
      const noiseCtx = noiseCanvas.getContext('2d');
      noiseCanvas.width = noiseSize;
      noiseCanvas.height = noiseSize;

      function resize() {
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function generateNoise() {
        const imageData = noiseCtx.createImageData(noiseSize, noiseSize);
        const data = imageData.data;

        for (let i = 0; i < data.length; i += 4) {
          const v = 110 + Math.random() * 70;
          data[i] = v;
          data[i + 1] = v;
          data[i + 2] = v;
          data[i + 3] = 255;
        }

        noiseCtx.putImageData(imageData, 0, 0);
      }

      let base = 0.04;
      let amplitude = 0.01;
      let t = 0;

      // L'Ambient Light Sensor n'est activé par défaut que sur une poignée de
      // navigateurs. Partout ailleurs la pièce tourne sur ses valeurs fixes, et
      // la dépendance à la lumière n'a pas lieu. La ligne le dit au lieu de le taire.
      function say(state) { sensorLine.textContent = 'sensor : ' + state; }

      if ('AmbientLightSensor' in window) {
        try {
          const sensor = new AmbientLightSensor();

          sensor.addEventListener('reading', () => {
            const lux = sensor.illuminance;
            const norm = Math.min(lux / 1000, 1);
            base = 0.03 + norm * 0.05;
            amplitude = 0.006 + norm * 0.012;
            say(Math.round(lux) + ' lux');
          });

          // sans ce gestionnaire, une permission refusée restait silencieuse
          sensor.addEventListener('error', (e) => {
            say(e.error && e.error.name === 'NotAllowedError' ? 'denied' : 'unavailable');
          });

          sensor.start();
          say('waiting');
        } catch (e) {
          say('unavailable');
        }
      }

      function loop() {
        t += 0.008;

        generateNoise();

        const breathing = base + Math.sin(t) * amplitude;
        canvas.style.opacity = breathing.toFixed(3);

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(
          noiseCanvas,
          0,
          0,
          canvas.width / dpr,
          canvas.height / dpr
        );

        requestAnimationFrame(loop);
      }

      window.addEventListener('resize', resize);
      resize();
      loop();
    })();
  </script>

  <script>
    document.getElementById('nav-back').addEventListener('click', (e) => {
      e.stopPropagation();
      window.history.back();
    });

    document.addEventListener("dblclick", (e) => {
      if (e.target.id === 'nav-back') return;
      window.location.href = "note.html";
    });
  </script>

</body>
</html>
