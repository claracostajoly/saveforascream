<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>HOLD — note</title>

  <style>
    :root{
      --bg:#ffffff;
      --fg:#111111;
      --muted:#666;
    }

    html,body{
      margin:0;
      background:var(--bg);
      color:var(--fg);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size:14px;
    }

    main{
      max-width:680px;
      margin:220px auto 160px;
      padding:0 30px;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    h1{
      font-size:clamp(12px,1.6vw,16px);
      font-weight:400;
      letter-spacing:0.02em;
      margin:0;
      margin-bottom:140px;
      text-align:center;
      /* même couleur et même opacité que le texte : rien ne ressort */
      color:var(--muted);
      opacity:0.75;
    }

    p{
      line-height:1.7;
      opacity:0.75;
      margin:0;
      text-align:left;
      color:var(--muted);
    }

  
        /* Aucun texte du site ne peut être sélectionné. Une sélection repeint le
           texte au contraste du navigateur et défait le régime graphique de la
           page, qui travaille au seuil. Elle permet aussi d'emporter ailleurs un
           texte dont la lisibilité dépend de son milieu d'apparition. */
        *, *::before, *::after {
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
        }
        ::selection { background: transparent; color: inherit; }
        ::-moz-selection { background: transparent; color: inherit; }
    
        /* Rien ne s'assombrit sous le doigt plus que le reste, et la
           surbrillance des navigateurs mobiles est neutralisée. */
        html, body { -webkit-tap-highlight-color: transparent; }

        #nav-back {
            position: fixed;
            top: 18px;
            left: 18px;
            z-index: 10;
            font-size: 11px;
            letter-spacing: 0.04em;
            color: #bbb;
            cursor: pointer;
            padding: 6px 10px;
            margin: -6px -10px;
            transition: color 0.3s;
            -webkit-user-select: none;
            user-select: none;
        }
        #nav-back:hover { color: #666; }
    </style>
</head>

<body>

  <div id="nav-back" title="retour">../</div>

  <main>

    <!-- ✔️ retour ACCUEIL (chemin sûr) -->
    <h1>
      <a href="/saveforascream/">HOLD_note</a>
    </h1>

    <p>
      hold operates as a minimal condition of persistence.  
      the image is not enhanced but sustained.  
      noise does not obscure — it enables.  
      what appears is not content but a threshold of visibility.
    </p>

  </main>

  <script>
    // ✔️ double clic → retour à l’œuvre (index du dossier hold)
    document.addEventListener("dblclick", () => {
      window.location.href = "/saveforascream/content/hold/";
    });
  </script>


    <script>
      // « ../ » ramène à l'œuvre dont cette note est la note. stopPropagation()
      // évite que le clic atteigne les gestionnaires de la page. Sans historique
      // (note ouverte directement), on va à l'index du dossier, qui est l'œuvre.
      document.getElementById('nav-back').addEventListener('click', (e) => {
        e.stopPropagation();
        if (window.history.length > 1) { window.history.back(); }
        else { window.location.href = './'; }
      });
    </script>

</body>
</html>
