<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>lutherie of nothingness</title>
    <style>
        body {
            background: #000;
            color: #333;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 10px;
            padding: 60px;
            margin: 0;
            text-transform: lowercase;
            line-height: 1.6;
        }
        #btn {
            cursor: pointer;
            color: #555;
            display: inline-block;
            margin-bottom: 60px;
        }
        #btn:hover { color: #888; }
        .log { margin-bottom: 2px; }
        .data { color: #444; }
        .manifesto-tiny { margin-top: 100px; max-width: 350px; color: #222; }
        /* retour en arrière : coin supérieur gauche, même régime typographique */
        #nav-back {
            position: fixed;
            top: 18px;
            left: 18px;
            z-index: 10;
            color: #555;
            cursor: pointer;
            text-decoration: none;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 11px;
            padding: 6px 10px;
            margin: -6px -10px;
            transition: color 0.3s;
        }
        #nav-back:hover { color: #888; }
    
        /* Aucun texte du site ne peut être sélectionné. Une sélection repeint le
           texte au contraste du navigateur et défait le régime graphique de la
           page, qui travaille au seuil. Elle permet aussi d'emporter ailleurs un
           texte dont la lisibilité dépend de son milieu d'apparition. */
        *, *::before, *::after {
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
        }
        ::selection { background: transparent; color: inherit; }
        ::-moz-selection { background: transparent; color: inherit; }
    
        /* Chemin vers la note. Même geste que « ../ » : rien n'est expliqué,
           mais ce qui est atteignable est montré. Sans lui, la note n'était
           joignable que par un double-clic que personne ne peut deviner. */
        #nav-note {
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 10;
            color: #555;
            cursor: pointer;
            font-size: 11px;
            letter-spacing: 0.04em;
            padding: 6px 10px;
            margin: -6px -10px;
            transition: color 0.3s;
            -webkit-user-select: none;
            user-select: none;
        }
        #nav-note:hover { color: #888; }
    </style>
</head>
<body>

    <div id="nav-note" title="note">./note</div>

    <div id="nav-back" title="retour">../</div>

    <div id="btn">push silence to the edge (initialize)</div>

    <!-- CORRECTIF 05 : plus de "digital void resonance" ni de "spectral emergence".
         Chaque ligne est soit un paramètre réel du graphe, soit une mesure. -->
    <div class="log">milieu : audiocontext, 2 delay lines in series</div>
    <div class="log">excitation : noise, gain 0.002</div>
    <div class="log">feedback : 0.94 / 1.00</div>
    <div class="log">output : lowpass 3500 hz</div>
    <div class="log">resonance : <span id="freq-text" class="data">—</span> hz</div>
    <div class="log">status : <span id="status-text" class="data">idle</span></div>

    <div class="manifesto-tiny">
        the instrument does not exist.
    </div>

    <script>

        // retour en arrière par le coin supérieur gauche. stopPropagation() évite
        // que ce clic déclenche aussi la pièce ou la navigation de la page.
        document.getElementById('nav-back').addEventListener('click', (e) => {
            e.stopPropagation();
            if (window.history.length > 1) { window.history.back(); }
            else { window.location.href = '../../index.html'; }
        });
    let audioCtx, analyser, dataArray;
    let isRunning = false;    // le système produit du son
    let isReleasing = false;  // la boucle est en train de s'éteindre
    let frame = 0;

    // CORRECTIF 06 : ces deux nœuds doivent vivre hors de startSystem()
    // pour que terminate puisse réellement relâcher la tension.
    let feedback = null, masterGain = null, noiseSource = null;

    // original physical constants
    const d1 = 0.003;
    const d2 = 0.0031;

    document.getElementById('btn').onclick = function() {
        if (isReleasing) return;   // pendant les quatre secondes du relâchement, le bouton ne répond pas
        if (!audioCtx) setupAudio();

        if (!isRunning) {
            audioCtx.resume().then(() => {
                startSystem();
                this.innerText = "release tension (terminate)";
                document.getElementById('status-text').innerText = "active_feedback";
                isRunning = true;
                draw();
            });

        } else {
            // CORRECTIF 06 : relâcher la tension au lieu de recharger la page.
            // La boucle s'éteint en s'entendant mourir, ce que l'instruction annonce.
            isRunning = false;
            isReleasing = true;
            // CORRECTIF : figer d'abord les automations en cours. Si l'on relâchait
            // pendant les trois secondes de montée, la rampe vers 1,5 restait
            // programmée : le volume remontait au maximum alors que la boucle était
            // déjà coupée, et l'on entendait le bruit brut à pleine puissance,
            // puis une coupure sèche quatre secondes plus tard.
            const now = audioCtx.currentTime;
            for (const p of [feedback.gain, masterGain.gain]) {
                if (p.cancelAndHoldAtTime) { p.cancelAndHoldAtTime(now); }
                else { const v = p.value; p.cancelScheduledValues(now); p.setValueAtTime(v, now); }
            }
            feedback.gain.setTargetAtTime(0, now, 0.6);
            masterGain.gain.setTargetAtTime(0, now, 0.8);
            document.getElementById('status-text').innerText = "releasing_";
            this.innerText = "push silence to the edge (initialize)";

            setTimeout(() => {
                // CORRECTIF : arrêter réellement, pour qu'« idle » soit vrai.
                // Sans stop(), chaque relance empilait un réseau de délais de plus,
                // inaudible mais toujours calculé.
                if (noiseSource) { try { noiseSource.stop(); } catch (e) {} noiseSource = null; }
                audioCtx.suspend();
                isReleasing = false;
                document.getElementById('status-text').innerText = "idle";
                document.getElementById('freq-text').innerText = "—";
            }, 4000);
        }
    };

    function setupAudio() {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        // CORRECTIF : 8192 au lieu de 2048. À 2048, un bin vaut 21,5 hz et la
        // fréquence affichée tombait sur 172 hz ; à 8192 elle tombe sur la
        // résonance réelle de la boucle. Le tracé, lui, ne lit que les 2048
        // premiers échantillons, donc l'oscilloscope garde exactement son allure.
        analyser.fftSize = 8192;
        dataArray = new Uint8Array(analyser.fftSize);
    }

    function startSystem() {
        const bufferSize = audioCtx.sampleRate * 2;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) { data[i] = Math.random() * 2 - 1; }

        noiseSource = audioCtx.createBufferSource();
        const noise = noiseSource;
        noise.buffer = buffer; noise.loop = true;

        const noiseGain = audioCtx.createGain();
        noiseGain.gain.value = 0.002;

        // routage inchangé : les deux délais EN SÉRIE dans une seule boucle.
        // Temps de boucle 3 + 3,1 = 6,1 ms -> fondamentale 163,9 hz + harmoniques.
        const delay1 = audioCtx.createDelay(); delay1.delayTime.value = d1;
        const delay2 = audioCtx.createDelay(); delay2.delayTime.value = d2;
        feedback = audioCtx.createGain(); feedback.gain.value = 0.94;

        const lpFilter = audioCtx.createBiquadFilter();
        lpFilter.type = "lowpass";
        lpFilter.frequency.value = 3500;

        const compressor = audioCtx.createDynamicsCompressor();
        compressor.threshold.setValueAtTime(-30, audioCtx.currentTime);
        compressor.ratio.setValueAtTime(12, audioCtx.currentTime);

        masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(0, audioCtx.currentTime);
        masterGain.gain.linearRampToValueAtTime(1.5, audioCtx.currentTime + 3);

        // CORRECTIF 07 : un limiteur, comme dans after/without.
        // masterGain monte à 1,5 et rien ne protégeait la sortie.
        const limiter = audioCtx.createDynamicsCompressor();
        limiter.threshold.setValueAtTime(-3, audioCtx.currentTime);
        limiter.ratio.setValueAtTime(20, audioCtx.currentTime);

        noise.connect(noiseGain);
        noiseGain.connect(delay1);
        delay1.connect(delay2);
        delay2.connect(feedback);
        feedback.connect(delay1);

        delay2.connect(lpFilter);
        lpFilter.connect(compressor);

        // CORRECTIF 07 : l'analyseur est maintenant APRÈS masterGain et le limiteur.
        // L'oscilloscope montre donc le son entendu, montée de trois secondes comprise.
        compressor.connect(masterGain);
        masterGain.connect(limiter);
        limiter.connect(analyser);
        analyser.connect(audioCtx.destination);

        noise.start();
    }

    // La résonance affichée est celle de la BOUCLE, pas du partiel le plus fort.
    // Comme rien n'amortit les aigus à l'intérieur, une vingtaine d'harmoniques ont
    // des amplitudes voisines : le maximum du spectre sautait de l'une à l'autre et
    // le chiffre ne se fixait jamais. L'autocorrélation cherche la période du signal,
    // c'est-à-dire le tour de boucle lui-même.
    const AC_WIN  = 2048;   // fenêtre d'analyse
    const AC_MIN  = 66;     // 1,5 ms  -> 668 hz
    const AC_MAX  = 662;    //  15 ms  ->  67 hz

    function measuredResonance() {
        let mean = 0;
        for (let i = 0; i < AC_WIN; i++) mean += dataArray[i];
        mean /= AC_WIN;

        let best = -Infinity, bestLag = 0;
        for (let lag = AC_MIN; lag <= AC_MAX; lag++) {
            let sum = 0;
            for (let i = 0; i < AC_WIN - lag; i++) {
                sum += (dataArray[i] - mean) * (dataArray[i + lag] - mean);
            }
            if (sum > best) { best = sum; bestLag = lag; }
        }
        return bestLag ? audioCtx.sampleRate / bestLag : 0;
    }

    function draw() {
        // CORRECTIF : le tracé reste vivant pendant le relâchement, pour qu'on voie
        // la forme d'onde s'effondrer en même temps qu'on l'entend mourir.
        if (!isRunning && !isReleasing) return;
        requestAnimationFrame(draw);

        // CORRECTIF : pas de décimale. Un bin vaut 5,4 hz, la décimale était inventée.
        if (frame++ % 15 === 0) {
            document.getElementById('freq-text').innerText = measuredResonance().toFixed(0);
        }

        // l'oscilloscope a été retiré : le signal est toujours lu, mais seulement
        // pour mesurer la résonance affichée.
        analyser.getByteTimeDomainData(dataArray);
    }
    </script>

    <script>
      document.getElementById('nav-note').addEventListener('click', (e) => {
        e.stopPropagation();          // sinon le clic déclenche aussi la page
        window.location.href = 'note.html';
      });
    </script>
</body>
</html>
