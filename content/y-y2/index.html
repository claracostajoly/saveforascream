<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- CORRECTIF 03 : y = y2 a deux solutions stables (0 et 1), c'est l'exemple
         canonique du point fixe. Le script Python calcule bien y = y + 1. -->
    <title>y = y + 1</title>
    <style>
        body {
            background: #000;
            color: #444;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            padding: 30px;
            margin: 0;
            text-transform: lowercase;
            line-height: 1.6;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            box-sizing: border-box;
            overflow: hidden;
            cursor: crosshair;
        }
        .status-container { padding-left: 0; }
        .data { color: #666; }
        #action-trigger {
            cursor: pointer;
            color: #555;
            text-decoration: none;
            margin-top: 20px;
            display: inline-block;
            transition: color 0.3s;
        }
        #action-trigger:hover { color: #fff; }
        @media (max-width: 768px) { body { padding: 20px; } }
    </style>
</head>
<body>

    <div class="status-container">
        <div class="log">y = y + 1</div>
        <div class="log">y : <span id="iterations" class="data">—</span></div>
        <!-- La ligne qui rend l'érosion visible, montrée comme une descente :
             sans le point de départ, la valeur seule est illisible. -->
        <div class="log">erosion : <span id="erosion" class="data">—</span> hz</div>
        <div class="log">status : <span id="state" class="data">idle</span></div>

        <div id="action-trigger" onclick="toggleAudio()">> open_channel</div>
    </div>

    <script>
        const state = document.getElementById('state');
        const trigger = document.getElementById('action-trigger');
        const iterDisplay = document.getElementById('iterations');
        const erosionDisplay = document.getElementById('erosion');

        let audioCtx = null;
        let gainNode = null;
        let filterNode = null;
        let noiseSource = null;
        let isPlaying = false;
        let currentIteration = 1;

        // NAVIGATION COMPATIBLE MULTI-CLIC & TOUCH (Exclut le bouton open_channel)
        let clickTimer = null;
        document.addEventListener('click', (e) => {
            if (e.target.id === 'action-trigger') return;
            if (clickTimer === null) {
                clickTimer = setTimeout(() => {
                    clickTimer = null;
                    window.history.back();
                }, 300);
            } else {
                clearTimeout(clickTimer);
                clickTimer = null;
                window.location.href = "note.html";
            }
        });

        let lastTap = 0;
        document.addEventListener('touchend', (e) => {
            if (e.target.id === 'action-trigger') return;
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTap;
            if (tapLength < 300 && tapLength > 0) {
                window.location.href = "note.html";
            }
            lastTap = currentTime;
        });

        // ═══════════════════════════════════════════════════════════════════
        // CORRECTIF 01 — LE CŒUR DE LA CORRECTION
        //
        // Avant :  Math.max(150, 900 - n * 8)      -> plancher atteint à n = 94
        //          Math.min(0.4, 0.15 + n * 0.005) -> plafond atteint à n = 50
        //
        // Au-delà, le compteur n'avait plus AUCUN effet sur le son : la pièce
        // sonnait à 1652 exactement comme à 94, et aurait sonné pareil à un
        // million. L'érosion était un événement ponctuel, achevé avant la
        // centième visite.
        //
        // Après : descente logarithmique, une octave tous les ~316x de visites,
        // sans plancher. L'usure ralentit toujours et n'arrive jamais.
        //
        //      n = 1      -> 828 hz        n = 10 000     -> 297 hz
        //      n = 100    -> 516 hz        n = 1 000 000  -> 171 hz
        //      n = 1 652  -> 369 hz        n = 10^9       ->  74 hz
        // ═══════════════════════════════════════════════════════════════════
        function erosionFreq(n) {
            const f = 900 * Math.pow(2, -Math.log10(1 + Math.max(0, n)) / 2.5);
            // garde-fou d'audibilité, atteint vers 5,9 milliards de visites :
            // il ne borne pas l'érosion, il protège d'un compteur aberrant.
            return Math.max(60, f);
        }

        // count.txt doit contenir un entier seul. Si le serveur renvoie autre chose
        // (page d'erreur html), on retombe sur 1 plutôt que de fermer le filtre à 3 hz.
        function readCount(text) {
            const m = String(text).trim().match(/^(\d{1,12})$/);
            const n = m ? parseInt(m[1], 10) : NaN;
            return Number.isFinite(n) && n > 0 ? n : 1;
        }

        // « 828 → 369 » : le point de départ rend le chiffre courant lisible.
        function showErosion(n) {
            return erosionFreq(1).toFixed(0) + " \u2192 " + erosionFreq(n).toFixed(0);
        }

        function erosionGain(freq) {
            // compense la perte d'énergie du filtre ; le plafond n'est qu'une sécurité
            return Math.min(0.5, 0.15 * Math.sqrt(900 / freq));
        }

        function updateCounter() {
            fetch('./outputs/count.txt?t=' + new Date().getTime())
                .then(response => response.ok ? response.text() : "1")
                .then(data => {
                    currentIteration = readCount(data);
                    iterDisplay.innerText = currentIteration;
                    erosionDisplay.innerText = showErosion(currentIteration);

                    if (isPlaying && filterNode) {
                        adjustTexture();
                    }
                })
                .catch(() => {
                    iterDisplay.innerText = "1";
                    erosionDisplay.innerText = showErosion(1);
                });
        }

        updateCounter();
        setInterval(updateCounter, 10000);

        function createNoiseBuffer() {
            const bufferSize = 2 * audioCtx.sampleRate;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }
            return noiseBuffer;
        }

        function adjustTexture() {
            const targetFreq = erosionFreq(currentIteration);
            filterNode.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.5);
            gainNode.gain.setTargetAtTime(erosionGain(targetFreq), audioCtx.currentTime, 0.2);
        }

        function toggleAudio() {
            if (!isPlaying) {
                state.innerText = "loading_residue...";

                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    filterNode = audioCtx.createBiquadFilter();
                    filterNode.type = 'lowpass';
                    filterNode.Q.setValueAtTime(2.0, audioCtx.currentTime);

                    gainNode = audioCtx.createGain();
                    gainNode.gain.setValueAtTime(0, audioCtx.currentTime);

                    filterNode.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                }

                if (audioCtx.state === 'suspended') audioCtx.resume();

                noiseSource = audioCtx.createBufferSource();
                noiseSource.buffer = createNoiseBuffer();
                noiseSource.loop = true;
                noiseSource.connect(filterNode);

                adjustTexture();

                gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                noiseSource.start(0);

                const targetGain = erosionGain(erosionFreq(currentIteration));
                gainNode.gain.linearRampToValueAtTime(targetGain, audioCtx.currentTime + 0.3);

                state.innerText = "streaming_residue";
                trigger.innerText = "> close_channel";
                state.style.color = "#aaa";
                isPlaying = true;
            } else {
                if (gainNode) {
                    gainNode.gain.setValueAtTime(gainNode.gain.value, audioCtx.currentTime);
                    gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
                }
                setTimeout(() => {
                    if (noiseSource) noiseSource.stop();
                    state.innerText = "idle";
                    trigger.innerText = "> open_channel";
                    state.style.color = "#444";
                    isPlaying = false;
                }, 210);
            }
        }

        setTimeout(() => { location.reload(); }, 300000);
    </script>
</body>
</html>
