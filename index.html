<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>saveforascream</title>
  <style>
    :root { 
      --bg: #000; 
      --text-color: #bbb; 
      --muted: #555; 
    }

    html, body {
      height: 100%; margin: 0;
      background: var(--bg); color: var(--text-color);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    a { color: inherit; text-decoration: none; }

    #titre {
      position: fixed; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      font-size: 24px; font-weight: 400;
      letter-spacing: .05em; white-space: nowrap;
      cursor: pointer; user-select: none; z-index: 10;
      color: var(--text-color);
      transition: opacity 0.3s ease; opacity: 0.8;
    }

    #titre:hover { opacity: 1; }

    #row {
      position: fixed; inset: 0;
      visibility: hidden; opacity: 0;
      transition: opacity .25s ease; z-index: 1;
      pointer-events: none;
    }
    #row.shown { visibility: visible; opacity: 1; }

    .entry {
      position: absolute; font-size: 14px; font-weight: 400;
      white-space: nowrap; opacity: .6;
      transition: opacity .2s ease, transform .25s ease;
      padding: .1rem .2rem; pointer-events: auto;
      color: var(--text-color);
      /* text-transform: lowercase supprimé pour voir les majuscules */
    }
    
    .entry:hover { opacity: 1; }

  
        /* Aucun texte du site ne peut être sélectionné. Une sélection repeint le
           texte au contraste du navigateur et défait le régime graphique de la
           page, qui travaille au seuil. Elle permet aussi d'emporter ailleurs un
           texte dont la lisibilité dépend de son milieu d'apparition. */
        *, *::before, *::after {
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
        }
        ::selection { background: transparent; color: inherit; }
        ::-moz-selection { background: transparent; color: inherit; }

        /* Aucune image ne se laisse prélever d'un geste. Même raison que pour le
           texte : ce qui est montré ici dépend de son milieu d'apparition, et
           l'emporter ailleurs — dans un dossier, dans un fil — le rend à un
           contraste qui n'est pas le sien. La règle n'empêche rien, elle énonce.
           Une capture d'écran reste possible, et le fichier reste joignable par
           son adresse : c'est le web, aucune page ne peut faire autrement. */
        img, video {
            -webkit-user-drag: none;
            user-drag: none;
            -webkit-touch-callout: none;
        }
    </style>
</head>
<body>
  <div id="titre">saveforascream</div>
  <div id="row" aria-live="polite"></div>

  <script>
    const JSON_PATH = 'content/index.json';
    const titre = document.getElementById('titre');
    const row = document.getElementById('row');

    let works = [];
    let shown = false;

    function rand(min, max) { return Math.random() * (max - min) + min; }

    // Les entrées sont tirées au hasard, mais jamais l'une sur l'autre ni sur le
    // titre, quelle que soit la taille de l'écran (téléphone compris).
    function scatter() {
      const entries = Array.from(row.children);
      if (!entries.length) return;
      entries.forEach(el => { el.style.fontSize = ''; });

      const W = window.innerWidth;
      const H = window.innerHeight;
      const margin = Math.max(14, Math.min(60, W * 0.06, H * 0.06));
      const gap = 10;                       // écart minimal entre deux entrées
      const tR = titre.getBoundingClientRect();
      const pad = Math.min(60, H * 0.05);
      const forbid = { left: tR.left - pad, right: tR.right + pad, top: tR.top - pad, bottom: tR.bottom + pad };

      const hit = (r, o, g) => !(r.x + r.w + g <= o.left || r.x - g >= o.right || r.y + r.h + g <= o.top || r.y - g >= o.bottom);
      const box = r => ({ left: r.x, right: r.x + r.w, top: r.y, bottom: r.y + r.h });

      // 1) tirage libre, avec refus de tout chevauchement
      function libre() {
        const placed = [];
        for (const el of entries) {
          const w = el.offsetWidth || 80, h = el.offsetHeight || 20;
          let ok = null;
          for (let t = 0; t < 600 && !ok; t++) {
            const r = { x: rand(margin, Math.max(margin, W - w - margin)), y: rand(margin, Math.max(margin, H - h - margin)), w, h };
            if (hit(r, forbid, 0)) continue;
            if (placed.some(p => hit(r, box(p), gap))) continue;
            ok = r;
          }
          if (!ok) return null;
          placed.push(ok);
        }
        return placed;
      }

      // 2) repli : une entrée par ligne, lignes mélangées, position horizontale au hasard
      function lignes() {
        const h = Math.max(...entries.map(el => el.offsetHeight || 20));
        const step = h + gap;
        const slots = [];
        for (let y = margin; y + h <= H - margin; y += step) {
          if (!(y + h <= forbid.top || y >= forbid.bottom)) continue;
          slots.push(y);
        }
        if (slots.length < entries.length) return null;
        for (let i = slots.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [slots[i], slots[j]] = [slots[j], slots[i]]; }
        return entries.map((el, i) => {
          const w = el.offsetWidth || 80;
          return { x: rand(margin, Math.max(margin, W - w - margin)), y: slots[i], w, h };
        });
      }

      let pos = null, taille = 14;
      for (let essai = 0; essai < 8 && !pos; essai++) {
        pos = libre() || lignes();
        if (!pos) {                          // écran trop petit : on réduit le corps et on recommence
          taille = Math.max(9, taille - 1);
          entries.forEach(el => { el.style.fontSize = taille + 'px'; });
        }
      }
      if (!pos) pos = lignes() || entries.map((el, i) => ({ x: margin, y: margin + i * ((H - 2 * margin) / entries.length) }));
      entries.forEach((el, i) => { el.style.transform = `translate(${pos[i].x}px, ${pos[i].y}px)`; });
    }

    function buildEntries() {
      row.innerHTML = '';
      works.forEach(it => {
        const a = document.createElement('a');
        a.className = 'entry';
        a.textContent = it.title;
        a.href = it.path;
        row.appendChild(a);
      });
    }

    titre.addEventListener('click', () => {
      if (!works.length) return;
      if (!shown) {
        buildEntries();
        row.classList.add('shown');
        shown = true;
      }
      requestAnimationFrame(scatter);
    });

    window.addEventListener('resize', () => { if (shown) scatter(); });

    // Chargement du JSON avec correction du cache
    fetch(JSON_PATH + '?_=' + Date.now())
      .then(r => r.json())
      .then(list => { works = list; })
      .catch(err => { console.error("Erreur JSON:", err); });
  </script>

    <script>
      /* Le menu contextuel est la porte la plus courte vers « enregistrer
         l'image ». La fermer est un geste, pas une protection. */
      document.addEventListener('contextmenu', (e) => {
        if (e.target.tagName === 'IMG' || e.target.tagName === 'VIDEO') e.preventDefault();
      });
      document.addEventListener('dragstart', (e) => {
        if (e.target.tagName === 'IMG') e.preventDefault();
      });
    </script>
</body>
</html>
