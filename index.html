<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>saveforascream</title>
  <style>
    :root { 
      --bg: #000; 
      --text-color: #bbb; 
      --muted: #555; 
    }

    html, body {
      height: 100%; margin: 0;
      background: var(--bg); color: var(--text-color);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    a { color: inherit; text-decoration: none; }

    #titre {
      position: fixed; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      font-size: 24px; font-weight: 400;
      letter-spacing: .05em; white-space: nowrap;
      cursor: pointer; user-select: none; z-index: 10;
      color: var(--text-color);
      transition: opacity 0.3s ease; opacity: 0.8;
    }

    #titre:hover { opacity: 1; }

    #row {
      position: fixed; inset: 0;
      visibility: hidden; opacity: 0;
      transition: opacity .25s ease; z-index: 1;
      pointer-events: none;
    }
    #row.shown { visibility: visible; opacity: 1; }

    .entry {
      position: absolute; font-size: 14px; font-weight: 400;
      white-space: nowrap; opacity: .6;
      transition: opacity .2s ease, transform .25s ease;
      padding: .1rem .2rem; pointer-events: auto;
      color: var(--text-color);
    }
    
    .entry:hover { opacity: 1; }

  
        /* Aucun texte du site ne peut être sélectionné. Une sélection repeint le
           texte au contraste du navigateur et défait le régime graphique de la
           page, qui travaille au seuil. Elle permet aussi d'emporter ailleurs un
           texte dont la lisibilité dépend de son milieu d'apparition. */
        *, *::before, *::after {
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
        }
        ::selection { background: transparent; color: inherit; }
        ::-moz-selection { background: transparent; color: inherit; }
    </style>
</head>
<body>
  <div id="titre">saveforascream</div>
  <div id="row" aria-live="polite"></div>

  <script>
    const JSON_PATH = 'content/index.json';
    const titre = document.getElementById('titre');
    const row = document.getElementById('row');

    let works = [];
    let shown = false;

    function rand(min, max) { return Math.random() * (max - min) + min; }

    // Dispersion des titres.
    //
    // L'ancienne version ne comparait que les ordonnees de deux titres et
    // renoncait apres quatre-vingts essais : deux titres a la meme hauteur
    // mais a des abscisses voisines se chevauchaient, et le nom du site
    // pouvait se faire traverser.
    //
    // Desormais, une bande horizontale par titre. Une bande qui croise le
    // nom du site n'est donnee qu'a un titre assez court pour tenir a sa
    // gauche ou a sa droite ; les autres vont ailleurs. Le hasard reste
    // entier, le chevauchement devient impossible tant qu'il reste des
    // bandes, ce qui est le cas des le format d'un telephone.
    function scatter() {
      const entries = Array.from(row.children);
      if (!entries.length) return;

      const W = window.innerWidth;
      const H = window.innerHeight;
      const marge   = 24;
      let   blanc   = 14;   // blanc minimal entre deux titres
      const garde   = 24;   // garde autour du nom du site

      const t = titre.getBoundingClientRect();
      const nom = { left: t.left - garde, top: t.top - garde,
                    right: t.right + garde, bottom: t.bottom + garde };

      const hMax  = Math.max(...entries.map(el => el.offsetHeight || 18));
      let   bande = hMax + 2 * blanc;
      let   nb    = Math.max(1, Math.floor((H - 2 * marge) / bande));
      // ecran trop court pour une bande par titre : le blanc se resserre
      // plutot que de laisser deux titres partager une bande.
      while (nb < entries.length && blanc > 4) {
        blanc -= 2;
        bande  = hMax + 2 * blanc;
        nb     = Math.max(1, Math.floor((H - 2 * marge) / bande));
      }

      // bandes libres, dans un ordre melange (Fisher-Yates)
      const libres = Array.from({ length: nb }, (_, i) => i);
      for (let i = libres.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [libres[i], libres[j]] = [libres[j], libres[i]];
      }

      // intervalles d'abscisses praticables pour une largeur w dans une bande
      function creneaux(w, yHaut, yBas) {
        const xMax = W - w - marge;
        if (xMax < marge) return [];
        const croise = !(yBas <= nom.top || yHaut >= nom.bottom);
        if (!croise) return [[marge, xMax]];
        const out = [];
        const gauche = nom.left - blanc - w;        // tient a gauche du nom ?
        if (gauche >= marge) out.push([marge, Math.min(gauche, xMax)]);
        const droite = nom.right + blanc;           // tient a sa droite ?
        if (droite <= xMax) out.push([droite, xMax]);
        return out;
      }

      const poses = [];
      const touche = (a, b) =>
        !(a.right + blanc <= b.left || a.left >= b.right + blanc ||
          a.bottom + blanc <= b.top || a.top >= b.bottom + blanc);

      entries.forEach(el => {
        const w = el.offsetWidth  || 80;
        const h = el.offsetHeight || 18;

        // premiere bande melangee ou ce titre tient reellement
        let k = -1, inter = null;
        for (let i = 0; i < libres.length; i++) {
          const yHaut = marge + libres[i] * bande + blanc;
          const yBas  = yHaut + h;
          const c = creneaux(w, yHaut, yBas);
          if (c.length) { k = i; inter = { c, yHaut, yBas }; break; }
        }

        let x, y;
        if (k >= 0) {
          libres.splice(k, 1);                     // la bande est prise
          const seg = inter.c[Math.floor(Math.random() * inter.c.length)];
          x = rand(seg[0], seg[1]);
          y = inter.yHaut;
        } else {
          // fenetre trop petite pour loger tout le monde : on garde le
          // placement le moins mauvais plutot que de boucler sans fin.
          let pire = Infinity;
          for (let essai = 0; essai < 150; essai++) {
            const bx = rand(marge, Math.max(marge, W - w - marge));
            const by = rand(marge, Math.max(marge, H - h - marge));
            const boite = { left: bx, top: by, right: bx + w, bottom: by + h };
            let conflits = touche(boite, nom) ? 1 : 0;
            for (const q of poses) if (touche(boite, q)) conflits++;
            if (conflits < pire) { pire = conflits; x = bx; y = by; }
            if (!conflits) break;
          }
        }

        poses.push({ left: x, top: y, right: x + w, bottom: y + h });
        el.style.transform = `translate(${x}px, ${y}px)`;
      });
    }

    function buildEntries() {
      row.innerHTML = '';
      works.forEach(it => {
        const a = document.createElement('a');
        a.className = 'entry';
        a.textContent = it.title;
        a.href = it.path;
        row.appendChild(a);
      });
    }

    titre.addEventListener('click', () => {
      if (!works.length) return;
      if (!shown) {
        buildEntries();
        row.classList.add('shown');
        shown = true;
      }
      requestAnimationFrame(scatter);
    });

    window.addEventListener('resize', () => { if (shown) scatter(); });

    // Chargement du JSON avec correction du cache
    fetch(JSON_PATH + '?_=' + Date.now())
      .then(r => r.json())
      .then(list => { works = list; })
      .catch(err => { console.error("Erreur JSON:", err); });
  </script>
</body>
</html>
